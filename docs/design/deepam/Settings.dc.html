<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<title>సెట్టింగ్‌లు</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&amp;family=Noto+Serif+Telugu:wght@600;700&amp;family=Outfit:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#E9E0D2}input,select,button{font:inherit}</style>
</helmet>
<div style="width: 560px; height: 1040px; box-sizing: border-box; background: #FBF7F0; color: #2B2118; font-family: 'Noto Sans Telugu', 'Outfit', sans-serif; font-size: 17px; line-height: 1.7; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #2B2118; color: #FFFFFF; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Noto Serif Telugu', serif; font-size: 25px; font-weight: 600; line-height: 1.4">సెట్టింగ్‌లు</h1>
    <button aria-label="మూసివేయి" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

    <section style="background: #FFFFFF; border: 1px solid #E9E0D2; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #5E4E40">భాష మరియు రూపం</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span>భాష</span>
        <div role="group" aria-label="భాష" style="display: flex; border: 1px solid #D9CDB9; border-radius: 999px; padding: 3px">
          <button aria-pressed="true" style="min-height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: #2B2118; color: #FFFFFF; cursor: pointer">తెలుగు</button>
          <button aria-pressed="false" style="min-height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #5E4E40; font-family: 'Outfit', sans-serif; cursor: pointer">English</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span>రూపం</span>
        <div role="group" aria-label="రూపం" style="display: flex; border: 1px solid #D9CDB9; border-radius: 999px; padding: 3px">
          <button aria-pressed="false" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #5E4E40; cursor: pointer">పగలు</button>
          <button aria-pressed="false" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #5E4E40; cursor: pointer">రాత్రి</button>
          <button aria-pressed="true" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #2B2118; color: #FFFFFF; cursor: pointer">ఆటో</button>
        </div>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E9E0D2; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #5E4E40">నగరం</h2>
      <label for="city" style="font-size: 15px; color: #5E4E40">సమయాలు ఈ నగరానికి లెక్కించబడతాయి</label>
      <select id="city" style="min-height: 48px; padding: 0 14px; border: 1px solid #D9CDB9; border-radius: 12px; background: #FFFFFF; color: #2B2118; font-size: 17px">
        <option>హైదరాబాద్</option>
        <option>విజయవాడ</option>
        <option>డల్లాస్</option>
      </select>
      <button style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px solid #A63A12; border-radius: 12px; background: #FFFFFF; color: #A63A12; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
        నా స్థానం వాడు
      </button>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E9E0D2; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #5E4E40">నా వివరాలు</h2>
        <span style="font-size: 14px; color: #5E4E40">ఐచ్ఛికం</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="nm" style="font-size: 15px; color: #5E4E40">పేరు</label>
        <input id="nm" type="text" value="రవితేజ" style="min-height: 48px; padding: 0 14px; border: 1px solid #D9CDB9; border-radius: 12px; font-size: 17px; color: #2B2118; background: #FFFFFF">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="dob" style="font-size: 15px; color: #5E4E40">పుట్టిన తేదీ</label>
          <input id="dob" type="date" style="min-height: 48px; padding: 0 12px; border: 1px solid #D9CDB9; border-radius: 12px; font-size: 16px; color: #2B2118; background: #FFFFFF">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="tob" style="font-size: 15px; color: #5E4E40">పుట్టిన సమయం</label>
          <input id="tob" type="time" value="12:00" style="min-height: 48px; padding: 0 12px; border: 1px solid #D9CDB9; border-radius: 12px; font-size: 16px; color: #2B2118; background: #FFFFFF">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="rasi" style="font-size: 15px; color: #5E4E40">జన్మ రాశి (పుట్టిన వివరాల నుండి ఆటోమేటిక్‌గా)</label>
        <select id="rasi" style="min-height: 48px; padding: 0 14px; border: 1px solid #D9CDB9; border-radius: 12px; background: #FFFFFF; color: #2B2118; font-size: 17px"><option>మేషం</option></select>
      </div>
      <p style="margin: 0; font-size: 14px; color: #5E4E40; display: flex; gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 5px"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>ఈ వివరాలు మీ పరికరంలోనే ఉంటాయి. ఎక్కడికీ పంపబడవు.</p>
    </section>

    <p style="margin: 0; font-size: 14px; color: #5E4E40; text-align: center">గణన: ద్రిక్ పద్ధతి · లాహిరి అయనాంశం</p>
  </div>

  <div style="margin-top: auto; border-top: 1px solid #E9E0D2; background: #FFFFFF; padding: 14px 24px; display: flex; justify-content: flex-end; gap: 10px">
    <button style="min-height: 48px; padding: 0 22px; border: 1px solid #D9CDB9; border-radius: 12px; background: #FFFFFF; color: #2B2118; font-weight: 600; cursor: pointer">రద్దు</button>
    <button style="min-height: 48px; padding: 0 26px; border: 0; border-radius: 12px; background: #A63A12; color: #FFFFFF; font-weight: 600; cursor: pointer">సేవ్ చేయి</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":1040}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}

</body>
</html>
