# yaml-language-server: $schema=https://raw.githubusercontent.com/ravitejakamalapuram/release-platform/main/schema/release.schema.json
# Release contract for ravitejakamalapuram/release-platform@v2 (keyless Chrome Web Store publishing).
# The repo root is the extension; `include` is an allowlist (the scripts newtab.html loads,
# plus icons) so store assets, docs and package files never ship.
app: telugupanchangam
test: npm test
targets:
  - type: chrome
    item_id: obgpdlhkahmdiepklldjnnmfmbhmgenn
    path: .
    include:
      - manifest.json
      - newtab.html
      - newtab.css
      - newtab.js
      - storage-shim.js
      - i18n.js
      - cities.js
      - panchang.js
      - festivals.js
      - sankalpam.js
      - horoscope.js
      - reminders.js
      - lib/astronomy.js
      - lib/tz.js
      - icons
      - fonts
