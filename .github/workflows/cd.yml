name: CD

# Store releases are on demand only (Actions -> CD -> Run workflow). Publishing on
# every push re-uploads while an item is in review and burns a version tag each time.
on:
  workflow_dispatch:

# Never cancel a release mid-flight: half-created tags/releases are bad state.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-cd.yml@v1
    with:
      extension-dir: '.'
    secrets:
      chrome-extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
      chrome-client-id: ${{ secrets.CHROME_CLIENT_ID }}
      chrome-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
      chrome-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
