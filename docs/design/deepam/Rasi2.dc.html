<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<title>రాశి ఫలాలు · 12 రాశులు ఒకే చూపులో</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&amp;family=Noto+Serif+Telugu:wght@600;700&amp;family=Outfit:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#F6EFE3}button{font:inherit}</style>
</helmet>
<div style="width: 880px; height: 1040px; box-sizing: border-box; padding: 32px; background: #F6EFE3; color: #2B2118; font-family: 'Noto Sans Telugu', 'Outfit', sans-serif; font-size: 17px; line-height: 1.7">
<section aria-labelledby="rt" style="background: #FFFFFF; border: 2px solid #4B2E83; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">

  <div style="background: #4B2E83; color: #FFFFFF; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="వెనుకకు" style="width: 44px; height: 44px; margin-left: -10px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.16); color: #FFFFFF; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <h1 id="rt" style="margin: 0; font-family: 'Noto Serif Telugu', serif; font-size: 23px; font-weight: 600; line-height: 1.4">రాశి ఫలాలు · ఈరోజు</h1>
    </div>
    <span style="font-size: 15px">ఆది, 18 అక్టోబర్</span>
  </div>

  <div style="padding: 24px; background: #F6F2FB; display: flex; flex-direction: column; gap: 20px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
        <button style="text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 12px; border-radius: 16px; background: {{c.bg}}; border: {{c.border}}; color: #2B2118; cursor: pointer; min-height: 132px">
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px">
            <span style="font-family: 'Noto Serif Telugu', serif; font-size: 23px; font-weight: 600; line-height: 1.4">{{c.name}}</span>
          </span>
          <sc-if value="{{c.mine}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: flex-start; font-size: 14px; font-weight: 600; padding: 0 8px; border-radius: 6px; background: #4B2E83; color: #FFFFFF">మీ రాశి</span>
          </sc-if>
          <span role="img" aria-label="{{c.aria}}" style="display: flex; gap: 2px; margin-top: auto">
            <sc-for list="{{c.stars}}" as="st" hint-placeholder-count="5">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1 5.6L12 15.6 7.1 18.4l1-5.6L4 8.9l5.6-.7z" fill="{{st.fill}}" stroke="{{st.stroke}}" stroke-width="1.5"></path></svg>
            </sc-for>
          </span>
          <span style="font-size: 15px; font-weight: 700; color: {{c.fg}}">{{c.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D5C9EA; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
        <div style="font-family: 'Noto Serif Telugu', serif; font-size: 26px; font-weight: 600; line-height: 1.4">మేషం · మీ రాశి</div>
        <div role="tablist" aria-label="విభాగం" style="display: flex; border: 1px solid #D5C9EA; border-radius: 999px; padding: 3px; background: #F6F2FB">
          <button role="tab" aria-selected="true" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #4B2E83; color: #FFFFFF; font-weight: 600; cursor: pointer">ఆరోగ్యం</button>
          <button role="tab" aria-selected="false" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #4B2E83; font-weight: 600; cursor: pointer">ఆదాయం</button>
          <button role="tab" aria-selected="false" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #4B2E83; font-weight: 600; cursor: pointer">కెరీర్</button>
        </div>
      </div>
      <p style="margin: 0; font-size: 19px; line-height: 1.85">అలసట, కంటి సమస్యల పట్ల జాగ్రత్త అవసరం. ప్రస్తుతం మీకు ఏలినాటి శని ప్రారంభ దశ (పన్నెండవ స్థానం). అనవసర ప్రయాణాలు తగ్గించుకోవడం, ఖర్చుల విషయంలో నియంత్రణ చాలా అవసరం. మానసిక ఒత్తిడికి లోనుకావద్దు.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: #5E4E40">
        <span>★ ఎక్కువ నక్షత్రాలు = అనుకూలం</span><span>కార్డ్ తాకితే వివరాలు</span>
      </div>
      <button style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #A63A12; color: #FFFFFF; font-weight: 600; cursor: pointer">12 రాశులు ఒకే కార్డ్‌గా పంచుకోండి</button>
    </div>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const BAND = {
      good: { label: 'అనుకూలం', fg: '#1E6B45', bg: '#E3F1E8', bd: '#A9D3BA' },
      great: { label: 'అత్యంత అనుకూలం', fg: '#1E6B45', bg: '#E3F1E8', bd: '#A9D3BA' },
      mixed: { label: 'మిశ్రమం', fg: '#6B4E0E', bg: '#F5ECD6', bd: '#D9C48E' },
      care: { label: 'జాగ్రత్త', fg: '#A3261B', bg: '#FBE3E0', bd: '#E7B3AB' },
    };
    const data = [['మేషం', 2], ['వృషభం', 3], ['మిథునం', 5], ['కర్కాటకం', 4], ['సింహం', 2], ['కన్య', 3], ['తుల', 4], ['వృశ్చికం', 3], ['ధనస్సు', 4], ['మకరం', 3], ['కుంభం', 4], ['మీనం', 4]];
    const cards = data.map(([name, s], i) => {
      const b = s === 5 ? BAND.great : s === 4 ? BAND.good : s === 3 ? BAND.mixed : BAND.care;
      const mine = i === 0;
      return {
        name, mine,
        label: b.label, fg: b.fg, bg: b.bg,
        border: mine ? '3px solid #4B2E83' : '1px solid ' + b.bd,
        aria: s + ' / 5 నక్షత్రాలు',
        stars: [1, 2, 3, 4, 5].map((n) => ({ fill: n <= s ? '#C98A12' : 'none', stroke: n <= s ? '#C98A12' : '#B9A98C' })),
      };
    });
    return { cards };
  }
}
</script>
</body>
</html>
