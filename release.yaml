# yaml-language-server: $schema=https://raw.githubusercontent.com/ravitejakamalapuram/release-platform/main/schema/release.schema.json
# Release contract for ravitejakamalapuram/release-platform@v2 (keyless Chrome Web Store publishing).
# The repo root is the extension; `include` is an allowlist (the scripts newtab.html loads,
# plus icons) so store assets, docs and package files never ship.
app: telugupanchangam
test: npm test
targets:
  - type: chrome
    item_id: obgpdlhkahmdiepklldjnnmfmbhmgenn
    path: .
    listing: chrome-store/store.config.json
    include:
      - manifest.json
      - newtab.html
      - newtab.css
      - newtab.js
      - storage-shim.js
      - i18n.js
      - cities.js
      - reminders.js
      - gita-verses.js
      - gita-verse.js
      - core/index.js
      - core/astronomy.js
      - core/calendar.js
      - core/errors.js
      - core/i18n.js
      - core/ids.js
      - core/panchanga.js
      - core/rules.js
      - core/time.js
      - core/timings.js
      - core/sankalpam.js
      - core/horoscope.js
      - core/horoscope-text.js
      - core/profiles
      - ui/share-card.js
      - ui/rating.js
      - lib/astronomy.js
      - lib/tz.js
      - icons
      - fonts
